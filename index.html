<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>正在前往 沈阳师范大学...</title>
  <!-- 3秒后备用 Meta 跳转 -->
  <meta http-equiv="refresh" content="3;url=https://www.synu.edu.cn/">
  <style>
    :root {
      --primary: #1d4ed8;
      --accent: #38bdf8;
      --bg-gradient: linear-gradient(135deg, #0f172a 0%, #1e293b 50%, #0f172a 100%);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--bg-gradient);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      color: #f8fafc;
      overflow: hidden;
      position: relative;
    }

    /* 柔和的背景动态光晕 */
    body::before,
    body::after {
      content: "";
      position: absolute;
      width: 450px;
      height: 450px;
      border-radius: 50%;
      filter: blur(90px);
      z-index: 0;
      opacity: 0.45;
      animation: float 10s ease-in-out infinite alternate;
    }

    body::before {
      background: #2563eb;
      top: -10%;
      left: 15%;
    }

    body::after {
      background: #0284c7;
      bottom: -10%;
      right: 15%;
      animation-delay: -5s;
    }

    @keyframes float {
      0% { transform: translate(0, 0) scale(1); }
      100% { transform: translate(40px, 30px) scale(1.1); }
    }

    /* 毛玻璃卡片主体 */
    .card {
      position: relative;
      z-index: 1;
      width: min(90%, 460px);
      padding: 44px 36px;
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 24px;
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.45);
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    /* 倒计时环形容器 */
    .countdown-container {
      position: relative;
      width: 88px;
      height: 88px;
      margin-bottom: 24px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .countdown-container svg {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      transform: rotate(-90deg);
    }

    .circle-bg {
      fill: none;
      stroke: rgba(255, 255, 255, 0.1);
      stroke-width: 5;
    }

    .circle-progress {
      fill: none;
      stroke: var(--accent);
      stroke-width: 5;
      stroke-linecap: round;
      stroke-dasharray: 220;
      stroke-dashoffset: 0;
      animation: progress 3s linear forwards;
    }

    @keyframes progress {
      to { stroke-dashoffset: 220; }
    }

    .timer-text {
      font-size: 32px;
      font-weight: 700;
      letter-spacing: -0.5px;
      color: #fff;
    }

    /* 标题与文字排版 */
    h1 {
      font-size: 22px;
      font-weight: 600;
      letter-spacing: 0.5px;
      margin-bottom: 8px;
    }

    p.subtitle {
      font-size: 14px;
      color: #94a3b8;
      margin-bottom: 28px;
    }

    /* 底部跳转链接按钮 */
    .btn-redirect {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      color: #cbd5e1;
      font-size: 13px;
      text-decoration: none;
      padding: 9px 18px;
      border-radius: 9999px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      transition: all 0.25s ease;
    }

    .btn-redirect:hover {
      background: rgba(255, 255, 255, 0.12);
      color: #fff;
      transform: translateY(-1px);
    }

    .btn-redirect svg {
      width: 14px;
      height: 14px;
      fill: currentColor;
    }
  </style>
</head>
<body>

  <main class="card">
    <div class="countdown-container">
      <svg viewBox="0 0 80 80">
        <circle class="circle-bg" cx="40" cy="40" r="35" />
        <circle class="circle-progress" cx="40" cy="40" r="35" />
      </svg>
      <span class="timer-text" id="countdown">3</span>
    </div>

    <h1>即将进入 沈阳师范大学</h1>
    <p class="subtitle">页面正在跳转中，请稍候...</p>

    <a href="https://www.synu.edu.cn/" class="btn-redirect" id="jumpBtn">
      <span>若未自动跳转，点击此处</span>
      <svg viewBox="0 0 20 20">
        <path fill-rule="evenodd" d="M3 10a.75.75 0 01.75-.75h10.638L10.23 5.29a.75.75 0 111.04-1.08l5.5 5.25a.75.75 0 010 1.08l-5.5 5.25a.75.75 0 11-1.04-1.08l4.158-3.96H3.75A.75.75 0 013 10z" clip-rule="evenodd" />
      </svg>
    </a>
  </main>

  <script>
    const targetUrl = "https://www.synu.edu.cn/";
    let remaining = 3;
    const timerElem = document.getElementById("countdown");

    const timer = setInterval(() => {
      remaining -= 1;
      if (remaining > 0) {
        timerElem.textContent = remaining;
      } else {
        clearInterval(timer);
        window.location.href = targetUrl;
      }
    }, 1000);
  </script>

</body>
</html>
